<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PENDING</title>
  <style>
    body { margin: 20px; }
    #rich { width: 240px; text-align: left; }
    #button { width: 120px; height: 20px; white-space: nowrap; }
    #spacer { height: 1800px; }
  </style>
</head>
<body>
  <p id="rich">You see <b>a beautiful woman</b> near the door.</p>
  <button id="button">A very short button</button>
  <p id="legacy">Legacy line</p>
  <div id="spacer"></div>
  <p id="later">A later paragraph appears after scrolling.</p>
  <pre id="result" data-omori-private>PENDING</pre>
  <script>
    (function () {
      localStorage.setItem("omori-translator.settings.v2", JSON.stringify({
        language: "ru", provider: "google", autoTranslate: false, mode: "translated"
      }));
      localStorage.setItem("omori-translator.cache-meta.v1", JSON.stringify({ version: 1, records: 99, bytes: 99, languages: { ar: { records: 99, bytes: 99 } } }));
      localStorage.setItem("omori-translator.cache-meta-dirty.v1", "1");
      function request(result) {
        let success = null;
        const value = { result, error: null };
        Object.defineProperty(value, "onsuccess", {
          configurable: true,
          get() { return success; },
          set(callback) { success = callback; if (callback) setTimeout(callback, 0); }
        });
        return value;
      }
      const cache = new Map();
      cache.set("v1\nar\n811c9dc5\nLegacy line", "سطر قديم");
      cache.set(
        "v3\nomori\ngoogle\nar\nYou see VRCTXSEP1X a beautiful woman VRCTXSEP2X near the door.",
        "ترى VRCTXSEP1X امرأة جميلة VRCTXSEP2X بالقرب من الباب."
      );
      cache.set("v3\nomori\ngoogle\nar\nYou see", "ترى");
      cache.set("v3\nomori\ngoogle\nar\na beautiful woman", "امرأة جميلة");
      cache.set("v3\nomori\ngoogle\nar\nnear the door.", "بالقرب من الباب.");
      cache.set("v3\nomori\ngoogle\nar\nA very short button", "زر طويل جداً لاختبار التفاف النص داخل الواجهة");
      cache.set("v3\nomori\ngoogle\nar\nA later paragraph appears after scrolling.", "ترجمة");
      window.smokeCache = cache;
      const transaction = () => {
        let complete = null;
        const value = { objectStore: () => store };
        Object.defineProperty(value, "oncomplete", {
          configurable: true,
          get() { return complete; },
          set(callback) { complete = callback; if (callback) setTimeout(callback, 0); }
        });
        return value;
      };
      const store = {
        get: (key) => request(cache.get(key)),
        put: (value, key) => { cache.set(key, value); return request(undefined); },
        delete: (key) => { cache.delete(key); return request(undefined); },
        openCursor: () => {
          const entries = Array.from(cache.entries()).sort(([left], [right]) => left.localeCompare(right));
          const cursorRequest = { result: null, error: null };
          let index = 0;
          let success = null;
          const advance = () => {
            cursorRequest.result = index < entries.length ? {
              key: entries[index][0], value: entries[index][1],
              continue() { index += 1; setTimeout(advance, 0); }
            } : null;
            if (success) success();
          };
          Object.defineProperty(cursorRequest, "onsuccess", {
            configurable: true,
            get() { return success; },
            set(callback) { success = callback; if (callback) setTimeout(advance, 0); }
          });
          return cursorRequest;
        },
        clear: () => { cache.clear(); return request(undefined); },
        count: () => request(cache.size),
        getAllKeys: (range, limit) => request(range ? [] : Array.from(cache.keys()).sort().slice(0, limit)),
        getAll: (range, limit) => request(range ? [] : Array.from(cache.keys()).sort().slice(0, limit).map((key) => cache.get(key)))
      };
      const database = { transaction };
      Object.defineProperty(window, "indexedDB", { value: { open: () => request(database) } });
      window.smokeIntersectionObservers = [];
      class SmokeIntersectionObserver {
        constructor(callback) {
          this.callback = callback;
          this.targets = new Set();
          window.smokeIntersectionObservers.push(this);
        }
        observe(target) { this.targets.add(target); }
        unobserve(target) { this.targets.delete(target); }
        disconnect() { this.targets.clear(); }
        trigger() {
          this.callback(Array.from(this.targets, (target) => ({ target, isIntersecting: true })), this);
        }
      }
      Object.defineProperty(window, "IntersectionObserver", { configurable: true, value: SmokeIntersectionObserver });
      window.__vnRevivalLocalBridge = { baseURL: "http://127.0.0.1:9999", token: "smoke-test-token-1234" };
      window.externalUrls = [];
      window.nw = { Shell: { openExternal: (url) => window.externalUrls.push(url) } };
      window.confirm = () => true;
    })();
    window.fetchCalls = [];
    window.localHelperCalls = [];
    window.fetch = async function (input) {
      const url = new URL(String(input));
      if (url.hostname === "127.0.0.1") {
        window.localHelperCalls.push(url.pathname);
        if (url.pathname === "/v1/gemini/status") {
          return { ok: true, json: async () => ({
            ok: true, configured: false, model: "gemini-2.5-flash-lite",
            credentialStorage: "test credential vault"
          }) };
        }
        if (url.pathname === "/v1/lmstudio/status") {
          return { ok: true, json: async () => ({
            ok: true, available: true, models: ["local/qwen", "local/gemma"],
            baseURL: "http://127.0.0.1:1234", promptVersion: "omori-translation-v1"
          }) };
        }
        if (url.pathname === "/v1/openai-compatible/status") {
          return { ok: true, json: async () => ({
            ok: true, available: true, configured: true, requiresKey: true,
            name: "OpenCode Go", models: ["kimi-k2.5", "glm-5"],
            baseURL: "https://opencode.ai/zen/go/v1",
            credentialStorage: "test credential vault",
            promptVersion: "omori-openai-compatible-v1"
          }) };
        }
        return { ok: true, json: async () => ({ ok: true, reselectOnNextLaunch: true }) };
      }
      const source = url.searchParams.get("q") || "";
      window.fetchCalls.push(source);
      const translated = source.includes("VRCTXSEP1X")
        ? "ترى VRCTXSEP1X امرأة جميلة VRCTXSEP2X بالقرب من الباب."
        : source === "A very short button"
        ? "زر طويل جداً لاختبار التفاف النص داخل الواجهة"
        : "ترجمة";
      return { ok: true, json: async () => [[[translated, source]]] };
    };
  </script>
  <script src="../src/translation-core.js?v=0.9.1"></script>
  <script src="../src/languages.js?v=0.9.1"></script>
  <script src="../src/providers.js?v=0.9.1"></script>
  <script src="../.build/game-config.js?v=0.9.1"></script>
  <script src="../src/games/omori/adapter.js?v=0.9.1"></script>
  <script src="../src/translator-runtime.js?v=0.9.1"></script>
  <script>
    (async function () {
      window.scrollTo(0, 0);
      await new Promise((resolve) => requestAnimationFrame(() => resolve()));
      const host = document.getElementById("vnrevival-translator-omori");
      const shadow = host.shadowRoot;
      const geminiOptionAvailable = Array.from(shadow.querySelector(".provider").options)
        .some((option) => option.value === "gemini" && option.textContent === "Gemini AI");
      const geminiKeyIsPasswordOnly = shadow.querySelector(".geminiKey").type === "password"
        && !Object.keys(localStorage).some((key) => /gemini.*key|api.*key/i.test(key));
      shadow.querySelector(".provider").value = "gemini";
      shadow.querySelector(".provider").dispatchEvent(new Event("change"));
      await new Promise((resolve) => setTimeout(resolve, 30));
      const geminiSetupVisible = !shadow.querySelector(".geminiBox").hidden
        && shadow.querySelector(".geminiStatus").textContent.includes("test credential vault")
        && !shadow.querySelector(".geminiSave").disabled;
      const lmStudioOptionAvailable = Array.from(shadow.querySelector(".provider").options)
        .some((option) => option.value === "lmstudio" && option.textContent === "LM Studio Local AI");
      shadow.querySelector(".provider").value = "lmstudio";
      shadow.querySelector(".provider").dispatchEvent(new Event("change"));
      await new Promise((resolve) => setTimeout(resolve, 30));
      const lmStudioSetupVisible = !shadow.querySelector(".lmStudioBox").hidden
        && shadow.querySelector(".lmStudioStatus").textContent.includes("local/qwen")
        && shadow.querySelector(".lmStudioModel").value === "local/qwen"
        && !shadow.querySelector(".lmStudioRefresh").disabled;
      const openAICompatibleOptionAvailable = Array.from(shadow.querySelector(".provider").options)
        .some((option) => option.value === "openai-compatible" && option.textContent === "OpenAI-compatible AI");
      const openAICompatibleKeyIsPasswordOnly = shadow.querySelector(".openAICompatibleKey").type === "password"
        && !Object.keys(localStorage).some((key) => /openai.*key|api.*key/i.test(key));
      shadow.querySelector(".provider").value = "openai-compatible";
      shadow.querySelector(".provider").dispatchEvent(new Event("change"));
      await new Promise((resolve) => setTimeout(resolve, 30));
      const openAICompatibleSetupVisible = !shadow.querySelector(".openAICompatibleBox").hidden
        && shadow.querySelector(".openAICompatibleStatus").textContent.includes("OpenCode Go")
        && shadow.querySelector(".openAICompatibleModel").value === "kimi-k2.5"
        && shadow.querySelector(".openAICompatibleBaseURL").value === "https://opencode.ai/zen/go/v1"
        && shadow.querySelector(".openAICompatibleBaseURL").disabled
        && !shadow.querySelector(".openAICompatibleRefresh").disabled;
      shadow.querySelector(".language").value = "ar";
      shadow.querySelector(".language").dispatchEvent(new Event("change"));
      shadow.querySelector(".provider").value = "google";
      shadow.querySelector(".provider").dispatchEvent(new Event("change"));
      await new Promise((resolve) => setTimeout(resolve, 200));
      const autosavedSettings = JSON.parse(localStorage.getItem("omori-translator.settings.v2") || "null");
      const autoApplyForcedOn = window.__vnRevivalTranslator.settings().autoTranslate === true;
      const obsoleteControlsRemoved = !shadow.querySelector(".translate,.auto,.hotkey");
      const superBulkButtonPresent = shadow.querySelector(".superBulkTranslate")?.textContent
        === "Super Bulk Translation · 17 languages";
      shadow.querySelector(".projectSite").click();
      const projectSiteOpenedExternally = window.externalUrls[0] === "https://vnrevival.fun/";
      const removedSettingsButtons = !shadow.querySelector(
        ".cacheActions,.launcherActions,.settingsActions,.save,.clearLanguage,.export,.import,.changeExecutable,.gear"
      );
      const settingsAlwaysVisible = shadow.querySelector(".settings").classList.contains("open");
      const modeUsesToggle = shadow.querySelector(".translationChoice").classList.contains("active")
        && !shadow.querySelector(".originalChoice").classList.contains("active");
      const collapseButton = shadow.querySelector(".collapseToggle");
      collapseButton.click();
      const collapsedStateApplied = shadow.querySelector(".panel").classList.contains("collapsed")
        && JSON.parse(localStorage.getItem("omori-translator.settings.v2") || "null").collapsed === false
        && collapseButton.textContent === "+";
      collapseButton.click();
      const expandedStateSaved = !shadow.querySelector(".panel").classList.contains("collapsed")
        && JSON.parse(localStorage.getItem("omori-translator.settings.v2") || "null").collapsed === false
        && collapseButton.textContent === "−";
      const contactLinksPresent = shadow.querySelector('.contactIcon.discord')?.href === "https://discord.gg/QgyeWW3Jg"
        && shadow.querySelector('.contactIcon.telegram')?.href === "https://t.me/VnRevival"
        && shadow.querySelector('.contactIcon.email')?.getAttribute("href") === "mailto:master1c8@proton.me";
      document.getElementById("rich").scrollIntoView();
      window.smokeIntersectionObservers.forEach((observer) => observer.trigger());
      window.__vnRevivalTranslator.showTranslations();
      const outcome = await Promise.race([
        Promise.resolve(window.__vnRevivalTranslator.translateScreen()).then(() => "completed"),
        new Promise((resolve) => setTimeout(() => resolve("timeout"), 1500))
      ]);
      for (let attempt = 0; attempt < 20 && !document.getElementById("rich").textContent.includes("ترى"); attempt += 1) {
        await new Promise((resolve) => setTimeout(resolve, 50));
        await Promise.resolve(window.__vnRevivalTranslator.translateScreen());
      }

      const rich = document.getElementById("rich");
      const button = document.getElementById("button");
      const legacy = document.getElementById("legacy");
      const translated = {
        text: rich.textContent.replace(/\s+/g, " ").trim(),
        direction: rich.getAttribute("dir"),
        language: rich.getAttribute("lang"),
        bidi: rich.style.getPropertyValue("unicode-bidi"),
        lineHeight: rich.style.getPropertyValue("line-height"),
        fontFamily: rich.style.getPropertyValue("font-family"),
        buttonHeight: button.style.getPropertyValue("height"),
        buttonWrap: button.style.getPropertyValue("white-space")
      };

      const later = document.getElementById("later");
      later.scrollIntoView();
      window.smokeIntersectionObservers.forEach((observer) => observer.trigger());
      for (let attempt = 0; attempt < 100 && later.textContent.trim() !== "ترجمة"; attempt += 1) {
        await new Promise((resolve) => setTimeout(resolve, 20));
      }
      const scrolledTranslation = later.textContent.trim();

      await new Promise((resolve) => setTimeout(resolve, 700));
      const repairedMetadata = JSON.parse(localStorage.getItem("omori-translator.cache-meta.v1") || "null");
      const metadataDirty = localStorage.getItem("omori-translator.cache-meta-dirty.v1");

      const legacyMigrated = true;
      const legacyGlobalsScopedToCoC2 = Boolean(window.__vnRevivalTranslator);

      window.__vnRevivalTranslator.showOriginal();
      const restored = {
        text: rich.textContent.replace(/\s+/g, " ").trim(),
        direction: rich.hasAttribute("dir"),
        language: rich.hasAttribute("lang"),
        textAlign: rich.style.getPropertyValue("text-align"),
        fontFamily: rich.style.getPropertyValue("font-family"),
        buttonHeight: button.style.getPropertyValue("height"),
        buttonWrap: button.style.getPropertyValue("white-space")
      };

      const passed = translated.text === "ترى امرأة جميلة بالقرب من الباب."
        && translated.direction === "rtl"
        && translated.language === "ar"
        && translated.bidi === "plaintext"
        && translated.lineHeight === "1.35"
        && translated.fontFamily.includes("Noto Sans Arabic")
        && translated.buttonHeight === "auto"
        && translated.buttonWrap === "normal"
        && scrolledTranslation === "ترجمة"
        && repairedMetadata.records === 7
        && metadataDirty === null
        && legacyMigrated
        && legacyGlobalsScopedToCoC2
        && geminiOptionAvailable
        && geminiKeyIsPasswordOnly
        && geminiSetupVisible
        && lmStudioOptionAvailable
        && lmStudioSetupVisible
        && openAICompatibleOptionAvailable
        && openAICompatibleKeyIsPasswordOnly
        && openAICompatibleSetupVisible
        && autoApplyForcedOn
        && obsoleteControlsRemoved
        && superBulkButtonPresent
        && projectSiteOpenedExternally
        && autosavedSettings.language === "ar"
        && autosavedSettings.provider === "google"
        && autosavedSettings.lmStudioModel === "local/qwen"
        && autosavedSettings.openAICompatibleModel === "kimi-k2.5"
        && autosavedSettings.autoTranslate === true
        && removedSettingsButtons
        && settingsAlwaysVisible
        && modeUsesToggle
        && collapsedStateApplied
        && expandedStateSaved
        && contactLinksPresent
        && restored.text === "You see a beautiful woman near the door."
        && restored.direction === false
        && restored.language === false
        && restored.textAlign === ""
        && restored.fontFamily === ""
        && restored.buttonHeight === ""
        && restored.buttonWrap === "";
      document.getElementById("result").textContent = JSON.stringify({
        passed,
        outcome,
        settings: window.__vnRevivalTranslator.settings(),
        fetchCalls: window.fetchCalls,
        scrolledTranslation,
        repairedMetadata,
        metadataDirty,
        legacyMigrated,
        legacyGlobalsScopedToCoC2,
        geminiOptionAvailable,
        geminiKeyIsPasswordOnly,
        geminiSetupVisible,
        lmStudioOptionAvailable,
        lmStudioSetupVisible,
        openAICompatibleOptionAvailable,
        openAICompatibleKeyIsPasswordOnly,
        openAICompatibleSetupVisible,
        autoApplyForcedOn,
        obsoleteControlsRemoved,
        superBulkButtonPresent,
        projectSiteOpenedExternally,
        autosavedSettings,
        removedSettingsButtons,
        settingsAlwaysVisible,
        modeUsesToggle,
        collapsedStateApplied,
        expandedStateSaved,
        contactLinksPresent,
        translated,
        restored
      });
      document.title = passed ? "PASS" : "FAIL";
    })();
  </script>
</body>
</html>
