      const cacheFileInput = shadow.querySelector(".cacheFile");
      async function selectSharedFile() {
        Object.defineProperty(cacheFileInput, "files", { configurable: true, value: [sharedFile] });
        cacheFileInput.dispatchEvent(new Event("change"));
        await new Promise((resolve) => setTimeout(resolve, 120));
      }
      await selectSharedFile();
      const importModalDetectedRussian = !shadow.querySelector(".packModal").hidden
        && shadow.querySelector(".packLanguage").value === "ru"
        && shadow.querySelector(".packSummary").textContent.includes("Russian")
        && shadow.querySelector(".packSummary").textContent.includes("1 translation");
      shadow.querySelector(".packCancel").click();
      await new Promise((resolve) => setTimeout(resolve, 30));
      const importCancellationKeptData = !localStorage.getItem("omori-translator.translation-packs.v1")
        && window.smokePackCache.size === 0;
      await selectSharedFile();
      shadow.querySelector(".packConfirm").click();
      for (let attempt = 0; attempt < 400 && shadow.querySelector(".removeTranslationPack").hidden; attempt += 1) {
        await new Promise((resolve) => setTimeout(resolve, 10));
      }
      const importedPackTakesPriority = window.__vnRevivalTranslator.getLanguage() === "ru"
        && window.__vnRevivalTranslator.queryMemoryCache(sharedSource) === importedTranslation
        && !shadow.querySelector(".removeTranslationPack").hidden
        && shadow.querySelector(".translationPackStatus").textContent.includes("friend-russian-cache.jsonl");
      shadow.querySelector(".removeTranslationPack").click();
      for (let attempt = 0; attempt < 400; attempt += 1) {
        if (!window.smokePackCache.size
          && shadow.querySelector(".removeTranslationPack").hidden
          && window.__vnRevivalTranslator.queryMemoryCache(sharedSource) !== importedTranslation) break;
        await new Promise((resolve) => setTimeout(resolve, 10));
      }
      const removingPackRestoresOwnCache = window.__vnRevivalTranslator.queryMemoryCache(sharedSource) === ownTranslation
        && shadow.querySelector(".removeTranslationPack").hidden
        && window.smokePackCache.size === 0;
      const translationPackImportFlow = importModalDetectedRussian && importCancellationKeptData
        && importedPackTakesPriority && removingPackRestoresOwnCache;

      const passed = translated.text === "ترى امرأة جميلة بالقرب من الباب."
        && translated.direction === "rtl"
        && translated.language === "ar"
        && translated.bidi === "plaintext"
        && translated.lineHeight === "1.35"
        && translated.fontFamily.includes("Noto Sans Arabic")
        && translated.buttonHeight === "auto"
        && translated.buttonWrap === "normal"
        && scrolledTranslation === "ترجمة"
        && repairedMetadata.records === 7
        && metadataDirty === null
        && legacyMigrated
        && legacyGlobalsScopedToCoC2
        && geminiOptionAvailable
        && geminiKeyIsPasswordOnly
        && geminiSetupVisible
        && lmStudioOptionAvailable
        && lmStudioSetupVisible
        && openAICompatibleOptionAvailable
        && openAICompatibleKeyIsPasswordOnly
        && openAICompatibleSetupVisible
        && openCodeReferralPresent
        && autoApplyForcedOn
        && obsoleteControlsRemoved
        && superBulkButtonRemoved
        && translationScopesPresent
        && fullTranslationScopeSwitch
        && liveTranslationLogPresent
        && activeTranslationWorkspace
        && stoppedTranslationWorkspace
        && stoppedStatusPreserved
        && translationWorkspaceRestored
        && projectSiteOpenedExternally
        && autosavedSettings.language === "ar"
        && autosavedSettings.provider === "google"
        && autosavedSettings.lmStudioModel === "local/qwen"
        && autosavedSettings.openAICompatibleModel === "kimi-k2.5"
        && autosavedSettings.autoTranslate === true
        && autosavedSettings.translationScope === "full"
        && removedSettingsButtons
        && settingsAlwaysVisible
        && modeUsesToggle
        && collapsedStateApplied
        && expandedStateSaved
        && contactLinksPresent
        && translationPackImportFlow
        && restored.text === "You see a beautiful woman near the door."
        && restored.direction === false
        && restored.language === false
        && restored.textAlign === ""
        && restored.fontFamily === ""
        && restored.buttonHeight === ""
        && restored.buttonWrap === "";
      document.getElementById("result").textContent = JSON.stringify({
        passed,
        outcome,
        settings: window.__vnRevivalTranslator.settings(),
        fetchCalls: window.fetchCalls,
        scrolledTranslation,
        repairedMetadata,
        metadataDirty,
        legacyMigrated,
        legacyGlobalsScopedToCoC2,
        geminiOptionAvailable,
        geminiKeyIsPasswordOnly,
        geminiSetupVisible,
        lmStudioOptionAvailable,
        lmStudioSetupVisible,
        openAICompatibleOptionAvailable,
        openAICompatibleKeyIsPasswordOnly,
        openAICompatibleSetupVisible,
        openCodeReferralPresent,
        autoApplyForcedOn,
        obsoleteControlsRemoved,
        superBulkButtonRemoved,
        translationScopesPresent,
        fullTranslationScopeSwitch,
        liveTranslationLogPresent,
        activeTranslationWorkspace,
        activeTranslationWorkspaceState,
        stoppedTranslationWorkspace,
        stoppedStatusPreserved,
        translationLogViewportStableTwice,
        firstPauseReady,
        firstPauseFilled,
        firstPauseStable,
        firstPauseOffset,
        firstPauseFinalOffset,
        firstResumeWorked,
        secondPauseReady,
        secondPauseFilled,
        secondPauseStable,
        secondPauseOffset,
        secondPauseFinalOffset,
        translationWorkspaceRestored,
        projectSiteOpenedExternally,
        autosavedSettings,
        removedSettingsButtons,
        settingsAlwaysVisible,
        modeUsesToggle,
        collapsedStateApplied,
        expandedStateSaved,
        contactLinksPresent,
        translationPackImportFlow,
        importModalDetectedRussian,
        importCancellationKeptData,
        importedPackTakesPriority,
        removingPackRestoresOwnCache,
        translated,
        restored
      });
      document.title = passed ? "PASS" : "FAIL";
    })();
  </script>
</body>
</html>
